<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>ECHO</title>
  <meta name="description" content="A browser fighting game where the final boss is a neural network trained on how you fight.">
  <meta name="theme-color" content="#05060a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    /* the game is 16:9: fill the window and letterbox the rest */
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; object-fit: contain; touch-action: none; user-select: none; -webkit-user-select: none; }
    #rotate { display: none; position: fixed; inset: 0; background: #05060a; color: #29f0ff; font: bold 16px Consolas, monospace; letter-spacing: 4px; align-items: center; justify-content: center; text-align: center; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    #trailer { display: none; position: fixed; inset: 0; background: #000; }
    #trailer video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div id="rotate">ROTATE YOUR PHONE<br><br>ECHO PLAYS IN LANDSCAPE</div>
  <div id="trailer"><video playsinline controls preload="none" src="/trailer.mp4"></video></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
